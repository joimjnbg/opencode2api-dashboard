<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencode2api 网关仪表盘</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --green:#3fb950; --red:#f85149; --yellow:#d29922; --blue:#58a6ff; --purple:#bc8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; padding:20px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .card .label { color:var(--dim); font-size:12px; margin-bottom:6px; }
  .card .value { font-size:22px; font-weight:600; }
  .card .value.small { font-size:16px; }
  .status-ok { color:var(--green); }
  .status-bad { color:var(--red); }
  .status-warn { color:var(--yellow); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  @media (max-width:900px){ .two{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .panel h2 { font-size:14px; margin-bottom:12px; color:var(--dim); font-weight:500; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:120px; }
  .bars div { flex:1; background:var(--blue); border-radius:2px 2px 0 0; min-width:2px; opacity:.85; position:relative; }
  .bars div:hover::after { content:attr(data-c); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:#000; padding:2px 6px; border-radius:4px; font-size:11px; white-space:nowrap; }
  .bars.tokens div { background:var(--purple); }
  .legend { display:flex; gap:16px; margin-top:8px; color:var(--dim); font-size:12px; flex-wrap:wrap; }
  .status-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .status-row:last-child { border-bottom:none; }
  .bar-row { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:12px; }
  .bar-row .name { width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-row .track { flex:1; height:10px; background:#0d1117; border-radius:5px; overflow:hidden; }
  .bar-row .fill { height:100%; background:var(--blue); border-radius:5px; }
  .bar-row .val { width:80px; text-align:right; color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--dim); font-weight:500; }
  .lvl-DEBUG { color:var(--dim); }
  .lvl-WARN { color:var(--yellow); }
  .lvl-INFO { color:var(--blue); }
  .lvl-ERROR { color:var(--red); }
  .recent { max-height:300px; overflow-y:auto; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:rgba(88,166,255,.15); color:var(--blue); }
  .pill.ok { background:rgba(63,185,80,.15); color:var(--green); }
  .pill.err { background:rgba(248,81,73,.15); color:var(--red); }
  .note { color:var(--dim); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<h1>opencode2api 网关仪表盘</h1>
<div class="sub">实时流量 + token/cost 用量 · 每 2 秒自动刷新 · 数据来源 /healthz + /v1/stats + 网关日志</div>

<div class="grid" id="healthCards"></div>

<div class="two">
  <div class="panel">
    <h2>最近 30 分钟请求量（每分钟）</h2>
    <div class="bars" id="trend"></div>
    <div class="legend"><span>蓝色：请求数</span><span id="trendNote"></span></div>
  </div>
  <div class="panel">
    <h2>失败状态分布</h2>
    <div id="statusDist" style="color:var(--dim);font-size:13px;"></div>
  </div>
</div>

<div class="grid" id="usageCards"></div>

<div class="two">
  <div class="panel">
    <h2>按小时 token 用量（累计）</h2>
    <div class="bars tokens" id="tokenBars"></div>
    <div class="legend"><span>紫色：input+cached tokens</span></div>
  </div>
  <div class="panel">
    <h2>按模型用量排行（近24h 窗口）</h2>
    <div id="modelRank" style="margin-top:4px;"></div>
  </div>
</div>

<div class="panel">
  <h2>实时请求日志（最新在前）</h2>
  <table>
    <thead><tr><th>时间</th><th>级别</th><th>事件</th><th>tier</th><th>代理</th><th>状态</th><th>request_id</th></tr></thead>
    <tbody id="logRows" class="recent"></tbody>
  </table>
</div>

<script>
async function fetchJSON(url){ const r = await fetch(url); return r.json(); }

function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shortId(id){ return id ? id.slice(0,12) + "…" : ""; }
function fmtInt(n){ if(n==null) return "0"; return Number(n).toLocaleString("en-US"); }
function fmtCost(n){ if(n==null) return "$0.0000"; return "$" + Number(n).toFixed(4); }
function fmtTokens(n){ n = Number(n)||0; if(n>=1e9) return (n/1e9).toFixed(2)+"B"; if(n>=1e6) return (n/1e6).toFixed(2)+"M"; if(n>=1e3) return (n/1e3).toFixed(1)+"K"; return String(n); }

async function renderHealth(){
  const h = await fetchJSON("/api/health");
  const cards = document.getElementById("healthCards");
  if (h.error) {
    cards.innerHTML = `<div class="card"><div class="label">网关</div><div class="value status-bad">不可达</div></div>`;
    return;
  }
  const ok = h.ready && h.status === "ok";
  const keyNote = h.keys ? `${h.keys.zen} zen / ${h.keys.go} go` : "-";
  cards.innerHTML = `
    <div class="card"><div class="label">网关状态</div><div class="value ${ok?'status-ok':'status-warn'}">${esc(h.status)}</div></div>
    <div class="card"><div class="label">模型目录</div><div class="value small">${esc(h.models.total)} 个模型</div></div>
    <div class="card"><div class="label">暴露模型</div><div class="value small">${esc(h.models.exposed)}</div></div>
    <div class="card"><div class="label">Key 池</div><div class="value small">${esc(keyNote)}</div></div>
    <div class="card"><div class="label">代理健康</div><div class="value small">${esc(h.proxies.healthy)}/${esc(h.proxies.total)}</div></div>
    <div class="card"><div class="label">版本</div><div class="value small">${esc(h.version)}</div></div>`;
}

function renderUsage(gs){
  const total = gs.total || {};
  const cards = document.getElementById("usageCards");
  if (!gs || gs.error) {
    cards.innerHTML = `<div class="card"><div class="label">用量统计</div><div class="value status-warn">暂不可用</div></div>`;
    return;
  }
  const uptime = (gs.uptime_seconds||0);
  const h = Math.floor(uptime/3600), m = Math.floor((uptime%3600)/60);
  const okRate = total.requests ? Math.round(total.success/total.requests*100) : 0;
  cards.innerHTML = `
    <div class="card"><div class="label">总请求</div><div class="value">${fmtInt(total.requests)}</div><div class="note">成功 ${fmtInt(total.success)} · 失败 ${fmtInt(total.failed)} · 成功率 ${okRate}%</div></div>
    <div class="card"><div class="label">总成本</div><div class="value ${Number(total.cost)>0?'status-warn':''}">${fmtCost(total.cost)}</div><div class="note">免费模型为 $0</div></div>
    <div class="card"><div class="label">Input tokens</div><div class="value small">${fmtTokens(total.input_tokens)}</div><div class="note">含 cached ${fmtTokens(total.cached_tokens)}</div></div>
    <div class="card"><div class="label">Output tokens</div><div class="value small">${fmtTokens(total.output_tokens)}</div><div class="note">其中 reasoning ${fmtTokens(total.reasoning_tokens)}</div></div>
    <div class="card"><div class="label">模型数</div><div class="value">${(gs.models||[]).length}</div></div>
    <div class="card"><div class="label">运行时长</div><div class="value small">${h}h ${m}m</div></div>`;
}

function renderTokenBars(gs){
  const el = document.getElementById("tokenBars");
  if (!gs || gs.error || !gs.hours || gs.hours.length === 0) {
    el.innerHTML = `<div class="note">暂无小时级用量数据</div>`;
    return;
  }
  const hours = [...gs.hours].sort((a,b)=>a.hour.localeCompare(b.hour)).slice(-24);
  const max = Math.max(1, ...hours.map(x=>(x.stats.input_tokens||0)));
  el.innerHTML = hours.map(x=>{
    const v = x.stats.input_tokens||0;
    const hgt = Math.round((v/max)*100);
    const label = x.hour.slice(5,16).replace("T"," ");
    return `<div data-c="${label}: ${fmtTokens(v)}" style="height:${Math.max(hgt,2)}%;opacity:${v?1:.2}" title="${esc(label)}"></div>`;
  }).join("");
}

function renderModelRank(gs){
  const el = document.getElementById("modelRank");
  if (!gs || gs.error || !gs.models || gs.models.length === 0) {
    el.innerHTML = `<div class="note">暂无模型用量数据</div>`;
    return;
  }
  const rows = gs.models.slice().sort((a,b)=>(b.stats.input_tokens+b.stats.output_tokens)-(a.stats.input_tokens+a.stats.output_tokens)).slice(0,8);
  const max = Math.max(1, ...rows.map(x=>x.stats.input_tokens+x.stats.output_tokens));
  el.innerHTML = rows.map(x=>{
    const total = x.stats.input_tokens+x.stats.output_tokens;
    const pct = Math.round(total/max*100);
    const reqs = x.stats.requests||0;
    return `<div class="bar-row">
      <span class="name" title="${esc(x.model)}">${esc(x.model)}</span>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <span class="val">${fmtTokens(total)} tok · ${reqs} req</span>
    </div>`;
  }).join("");
}

function renderStats(){
  fetchJSON("/api/stats").then(s => {
    const trend = document.getElementById("trend");
    const max = Math.max(1, ...s.buckets);
    trend.innerHTML = s.buckets.map((v,i)=>{
      const hgt = Math.round((v/max)*100);
      return `<div data-c="${v}" style="height:${Math.max(hgt,2)}%;opacity:${v?1:.2}"></div>`;
    }).join("");
    document.getElementById("trendNote").textContent = `共 ${s.total} 条日志记录`;

    const dist = document.getElementById("statusDist");
    const statuses = s.byStatus || {};
    const keys = Object.keys(statuses);
    dist.innerHTML = keys.length === 0
      ? "暂无失败请求"
      : keys.map(k=>`<div class="status-row"><span>HTTP ${esc(k)}</span><span class="status-bad">${statuses[k]} 次</span></div>`).join("");

    const rows = document.getElementById("logRows");
    rows.innerHTML = s.recent.map(e=>{
      const cls = e.msg==="upstream accepted request" ? "pill ok" : (e.msg==="upstream request failed" ? "pill err" : "pill");
      const lvl = e.level || "";
      const status = e.status || (e.msg==="upstream accepted request" ? "200" : "");
      return `<tr>
        <td>${esc(e.time.replace("T"," ").slice(5,19))}</td>
        <td class="lvl-${esc(lvl)}">${esc(lvl)}</td>
        <td><span class="${cls}">${esc(e.msg)}</span></td>
        <td>${esc(e.tier)}</td>
        <td>${esc(e.proxy)}</td>
        <td>${esc(status)}</td>
        <td style="color:var(--dim)">${esc(shortId(e.request_id))}</td>
      </tr>`;
    }).join("");
  });
}

function refreshGatewayStats(){
  fetchJSON("/api/gateway-stats").then(gs => {
    renderUsage(gs);
    renderTokenBars(gs);
    renderModelRank(gs);
  });
}

renderHealth();
renderStats();
refreshGatewayStats();
setInterval(renderHealth, 2000);
setInterval(renderStats, 2000);
setInterval(refreshGatewayStats, 5000);
</script>
</body>
</html>
