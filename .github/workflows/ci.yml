name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o opencode2api ./

      - name: node syntax check
        run: node --check dashboard.mjs && node --check oc-stats.mjs

      - name: config example sanity
        run: |
          cp config.example.json config.json
          test -f config.json && echo "config.example.json is valid JSON:"
          python3 -c "import json;json.load(open('config.example.json'));print('OK')"